<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        width: 100px;
        height: 100px;
        background-color: red;
        position: relative;
        animation-name: example;
        animation-duration: 4s;
        animation-iteration-count: 2;
        animation-direction: alternate;
      }
      @keyframes example {
        0% {
          background-color: red;
          left: 0px;
          top: 0px;
        }
        25% {
          background-color: yellow;
          left: 200px;
          top: 0px;
        }
        50% {
          background-color: blue;
          left: 200px;
          top: 200px;
        }
        75% {
          background-color: green;
          left: 0px;
          top: 200px;
        }
        100% {
          background-color: red;
          left: 0px;
          top: 0px;
        }
      }
      @media screen and (min-width: 480px) {
        #leftsidebar {
          width: 200px;
          float: left;
        }
        #main {
          margin-left: 216px;
        }
      }
      .column {
        float: left;
        width: 25%;
      }
      @media screen and (max-width: 992px) {
        .column {
          width: 50%;
        }
      }
      @media screen and (max-width: 600px) {
        .column {
          width: 100%;
        }
      }
    </style>
    <!-- los ultimos dos estan relacionados con el diseño responsive-->
  </head>
  <body>
    <table>

    </table>
    <div>
      <p>soy un parrafo dentro de un div</p>
    </div>
  </body>
</html>

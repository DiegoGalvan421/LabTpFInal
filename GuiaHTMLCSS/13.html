<!doctype html>
<html lang="en">
  <head>
    <!-- de 13 a 14-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h1 {
        font-style: italic;
        font-family: Verdana;
        font-size: 50px;
        text-transform: uppercase;
      }
      p {
        text-indent: 20px;
        text-transform: capitalize;
      }
      div {
        width: 100px;
        height: 100px;
        background: red;
        transition: width 2s;
      }
      div:hover {
        width: 300px;
      }
    </style>
    <!--parece que el hover hace que cuando pones el mouse el div se anima-->

  </head>
  <body>
    <h1>Título</h1>
    <p>Este es un párrafo.</p>
    <div>
        <p>Este es un párrafo dentro de un div.</p>
    </div>
  </body>
</html>
